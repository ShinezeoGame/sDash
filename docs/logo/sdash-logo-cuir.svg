<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
  <clipPath id="tile"><rect width="1024" height="1024" rx="232"/></clipPath>
  <filter id="grain" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="3" seed="3" stitchTiles="stitch" result="n"/>
    <feDiffuseLighting in="n" surfaceScale="3.4" diffuseConstant="1" lighting-color="#fff" result="lit">
      <feDistantLight azimuth="235" elevation="58"/>
    </feDiffuseLighting>
    <feColorMatrix in="lit" type="saturate" values="0" result="gray"/>
    <feComponentTransfer in="gray" result="soft">
      <feFuncR type="linear" slope="0.52" intercept="0.54"/>
      <feFuncG type="linear" slope="0.52" intercept="0.54"/>
      <feFuncB type="linear" slope="0.52" intercept="0.54"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" in2="soft" mode="multiply" result="m"/>
    <feComposite in="m" in2="SourceAlpha" operator="in"/>
  </filter>
  <filter id="haze" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".38"/>
    <stop offset=".45" stop-color="#fff" stop-opacity=".05"/>
    <stop offset="1" stop-color="#000" stop-opacity=".35"/>
  </linearGradient>

  <filter id="grainFine" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="5" result="n"/>
    <feDiffuseLighting in="n" surfaceScale="1.8" lighting-color="#fff" result="lit">
      <feDistantLight azimuth="235" elevation="60"/>
    </feDiffuseLighting>
    <feColorMatrix in="lit" type="saturate" values="0" result="gray"/>
    <feComponentTransfer in="gray" result="soft">
      <feFuncR type="linear" slope=".38" intercept=".66"/>
      <feFuncG type="linear" slope=".38" intercept=".66"/>
      <feFuncB type="linear" slope=".38" intercept=".66"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" in2="soft" mode="multiply" result="m"/>
    <feComposite in="m" in2="SourceAlpha" operator="in"/>
  </filter>
  <radialGradient id="leather" cx="30%" cy="22%" r="95%">
    <stop offset="0" stop-color="#7A4423"/>
    <stop offset=".5" stop-color="#4E2913"/>
    <stop offset="1" stop-color="#22110A"/>
  </radialGradient>
  <radialGradient id="patch" cx="38%" cy="30%" r="80%">
    <stop offset="0" stop-color="#E2A869"/>
    <stop offset=".55" stop-color="#C07D43"/>
    <stop offset="1" stop-color="#8D5226"/>
  </radialGradient>
  <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="14"/><feOffset dy="16"/>
    <feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="deboss" x="-10%" y="-10%" width="120%" height="120%">
    <feOffset in="SourceAlpha" dy="7" result="o"/>
    <feGaussianBlur in="o" stdDeviation="4" result="b"/>
    <feComposite in="SourceAlpha" in2="b" operator="out" result="inner"/>
    <feFlood flood-color="#1E0C03" flood-opacity=".85"/>
    <feComposite in2="inner" operator="in" result="shade"/>
    <feOffset in="SourceAlpha" dy="5" result="o2"/>
    <feComposite in="o2" in2="SourceAlpha" operator="out" result="lip"/>
    <feFlood flood-color="#FFE2BC" flood-opacity=".38"/>
    <feComposite in2="lip" operator="in" result="light"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="shade"/><feMergeNode in="light"/></feMerge>
  </filter>
</defs>
<g clip-path="url(#tile)">
  <rect width="1024" height="1024" fill="url(#leather)" filter="url(#grain)"/>
  <ellipse cx="300" cy="200" rx="360" ry="220" fill="#FFD9A8" opacity=".12" filter="url(#haze)"/>
  
  <rect x="62" y="62" width="900" height="900" rx="176" fill="none" stroke="#000" stroke-opacity=".28" stroke-width="16"/>
  <rect x="62" y="62" width="900" height="900" rx="176" fill="none" stroke="#000" stroke-opacity=".45" stroke-width="7" stroke-dasharray="24 17" stroke-linecap="round" transform="translate(0 3)"/>
  <rect x="62" y="62" width="900" height="900" rx="176" fill="none" stroke="#F3DDB8" stroke-opacity=".92" stroke-width="7" stroke-dasharray="24 17" stroke-linecap="round"/>
  <g filter="url(#drop)">
    <circle cx="512" cy="512" r="304" fill="#6E3B1A"/>
    <circle cx="512" cy="507" r="298" fill="url(#patch)" filter="url(#grainFine)"/>
  </g>
  <circle cx="512" cy="507" r="296" fill="none" stroke="#FFE6C4" stroke-opacity=".35" stroke-width="3" stroke-dasharray="930 1000" transform="rotate(200 512 507)"/>
  <g transform="translate(0 -5)">
  <circle cx="512" cy="512" r="258" fill="none" stroke="#000" stroke-opacity=".22" stroke-width="14"/>
  <circle cx="512" cy="512" r="258" fill="none" stroke="#000" stroke-opacity=".45" stroke-width="6" stroke-dasharray="20 15" stroke-linecap="round" transform="translate(0 3)"/>
  <circle cx="512" cy="512" r="258" fill="none" stroke="#F6E6CC" stroke-opacity=".95" stroke-width="6" stroke-dasharray="20 15" stroke-linecap="round"/></g>
  <path d="M515.9200000000001 653.68Q492.96000000000004 653.68 470.84000000000003 647.52Q448.72 641.36 430.24 630.44Q411.76 619.52 398.32 603.8399999999999L442.0 559.6Q456.0 575.28 474.48 583.12Q492.96000000000004 590.96 515.36 590.96Q533.28 590.96 542.52 585.9200000000001Q551.76 580.88 551.76 570.8Q551.76 559.6 541.96 553.44Q532.1600000000001 547.28 516.48 543.0799999999999Q500.8 538.88 483.72 533.56Q466.64000000000004 528.24 450.96000000000004 519.56Q435.28000000000003 510.88 425.48 495.47999999999996Q415.68 480.0799999999999 415.68 455.43999999999994Q415.68 429.67999999999995 428.28 410.64Q440.88 391.59999999999997 464.4 380.9599999999999Q487.92 370.31999999999994 519.84 370.31999999999994Q553.44 370.31999999999994 580.6 382.0799999999999Q607.76 393.8399999999999 625.6800000000001 417.35999999999996L581.44 461.59999999999997Q569.12 446.47999999999996 553.72 439.76Q538.32 433.03999999999996 520.4000000000001 433.03999999999996Q504.16 433.03999999999996 495.48 438.08Q486.8 443.12 486.8 452.0799999999999Q486.8 462.15999999999997 496.6 467.76Q506.40000000000003 473.35999999999996 522.08 477.55999999999995Q537.76 481.76 554.84 487.08Q571.9200000000001 492.4 587.32 501.91999999999996Q602.72 511.43999999999994 612.52 527.1199999999999Q622.32 542.8 622.32 567.4399999999999Q622.32 607.1999999999999 593.76 630.4399999999999Q565.2 653.68 515.9200000000001 653.68Z" fill="#6B3816" fill-opacity=".72" filter="url(#deboss)" transform="translate(0 -5)"/>
</g>
<path d="M0 0" fill="none"/>
<rect width="1024" height="1024" rx="232" fill="none" stroke="url(#edge)" stroke-width="5"/>
</svg>
