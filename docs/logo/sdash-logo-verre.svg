<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
  <clipPath id="tile"><rect width="1024" height="1024" rx="232"/></clipPath>
  <filter id="grain" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.48" numOctaves="3" seed="8" stitchTiles="stitch" result="n"/>
    <feDiffuseLighting in="n" surfaceScale="3.2" diffuseConstant="1" lighting-color="#fff" result="lit">
      <feDistantLight azimuth="235" elevation="58"/>
    </feDiffuseLighting>
    <feColorMatrix in="lit" type="saturate" values="0" result="gray"/>
    <feComponentTransfer in="gray" result="soft">
      <feFuncR type="linear" slope="0.46" intercept="0.6"/>
      <feFuncG type="linear" slope="0.46" intercept="0.6"/>
      <feFuncB type="linear" slope="0.46" intercept="0.6"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" in2="soft" mode="multiply" result="m"/>
    <feComposite in="m" in2="SourceAlpha" operator="in"/>
  </filter>
  <filter id="haze" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".38"/>
    <stop offset=".45" stop-color="#fff" stop-opacity=".05"/>
    <stop offset="1" stop-color="#000" stop-opacity=".35"/>
  </linearGradient>

  <radialGradient id="leather" cx="28%" cy="20%" r="95%">
    <stop offset="0" stop-color="#D88A4B"/>
    <stop offset=".42" stop-color="#9E5527"/>
    <stop offset="1" stop-color="#3E1F0E"/>
  </radialGradient>
  <radialGradient id="ember" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#FF9A4D" stop-opacity=".75"/>
    <stop offset="1" stop-color="#FF9A4D" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="disc"><circle cx="512" cy="512" r="292"/></clipPath>
  <filter id="frost" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="22"/></filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="26"/></filter>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="16"/></filter>
  <linearGradient id="glassFill" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFF4E6" stop-opacity=".34"/>
    <stop offset=".55" stop-color="#FFE3C4" stop-opacity=".12"/>
    <stop offset="1" stop-color="#FFC890" stop-opacity=".16"/>
  </linearGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
    <stop offset=".5" stop-color="#fff" stop-opacity=".15"/>
    <stop offset="1" stop-color="#F7C57E" stop-opacity=".75"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".45"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="letter" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFF6EA"/>
    <stop offset="1" stop-color="#F7C57E"/>
  </linearGradient>
</defs>
<g clip-path="url(#tile)">
  <g id="bg">
    <rect width="1024" height="1024" fill="url(#leather)" filter="url(#grain)"/>
    <ellipse cx="300" cy="200" rx="360" ry="220" fill="#FFD9A8" opacity=".22" filter="url(#haze)"/>
  </g>
  
  <rect x="62" y="62" width="900" height="900" rx="176" fill="none" stroke="#000" stroke-opacity=".28" stroke-width="16"/>
  <rect x="62" y="62" width="900" height="900" rx="176" fill="none" stroke="#000" stroke-opacity=".45" stroke-width="7" stroke-dasharray="24 17" stroke-linecap="round" transform="translate(0 3)"/>
  <rect x="62" y="62" width="900" height="900" rx="176" fill="none" stroke="#F7C57E" stroke-opacity=".70" stroke-width="7" stroke-dasharray="24 17" stroke-linecap="round"/>
  <ellipse cx="512" cy="790" rx="235" ry="42" fill="#000" opacity=".42" filter="url(#soft)"/>
  <circle cx="512" cy="512" r="330" fill="url(#ember)" opacity=".55"/>
  <g clip-path="url(#disc)">
    <use href="#bg" filter="url(#frost)"/>
    <rect width="1024" height="1024" fill="url(#glassFill)"/>
    <circle cx="512" cy="560" r="230" fill="url(#ember)"/>
    <ellipse cx="470" cy="330" rx="250" ry="130" fill="url(#sheen)"/>
  </g>
  <circle cx="512" cy="512" r="290" fill="none" stroke="url(#rim)" stroke-width="7"/>
