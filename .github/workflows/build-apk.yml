name: Construire l'APK

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Analyse, tests et APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # nécessaire pour publier la Release

    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Analyse statique
        run: flutter analyze

      - name: Tests
        run: flutter test

      # Facultatif : avec une clé personnelle, les mises à jour s'installent par-dessus
      # l'ancienne version sans avoir à désinstaller (voir README).
      - name: Clé de signature
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          {
            echo "storeFile=app/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      # Le numéro de compilation sert de versionCode : il augmente à chaque exécution,
      # ce qui permet d'installer une mise à jour par-dessus la version précédente.
      - name: Compilation de l'APK
        run: |
          flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk sdash.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sdash-apk
          path: sdash.apk
          retention-days: 30

      # Sur la branche par défaut, l'APK est publié comme « Release » : le lien
      # …/releases/latest/download/sdash.apk du README pointe toujours vers la dernière version.
      - name: Publication de la version
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: sDash 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: sdash.apk
          body: |
            APK Android de sDash compilé automatiquement (commit ${{ github.sha }}).

            Installation : téléchargez `sdash.apk` sur la tablette, ouvrez-le et autorisez
            l'installation d'applications de sources inconnues si Android le demande.
